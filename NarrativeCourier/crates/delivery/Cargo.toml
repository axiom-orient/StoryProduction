[package]
name = "narrative-courier-delivery"
version = "0.12.1"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
narrative-courier-runtime = { path = "../runtime" }
narrative-courier-contracts = { path = "../contracts" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
tempfile = "3"
