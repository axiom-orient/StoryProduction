[package]
name = "sts-workflow"
version = "0.12.1"
edition = "2021"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
serde_yaml = "0.9"
narrative-courier-runtime = { path = "../runtime" }
narrative-courier-contracts = { path = "../contracts" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
