[package]
name = "geultu-studio"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Local loopback UI/UX adapter for the Geultu engine"

[[bin]]
name = "GeultuStudio"
path = "src/main.rs"

[dependencies]
geultu = { path = "../../crates/geultu" }
geultu-writing = { path = "../geultu-writing" }
geultu-writer-process = { path = "../geultu-writer-process" }
serde.workspace = true
serde_json.workspace = true
