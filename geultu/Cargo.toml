[workspace]
members = [
    "crates/geultu",
    "crates/geultu-cli",
    "adapters/geultu-writing",
    "adapters/geultu-writer-process",
    "adapters/geultu-studio",
]
resolver = "2"

[workspace.package]
version = "5.0.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "=0.3.2"
sha2 = "0.10"
jsonschema = { version = "=0.50.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
